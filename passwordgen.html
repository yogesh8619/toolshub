<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | ToolKit</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .generator-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .options {
            margin: 20px 0;
        }
        .option-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        .result {
            display: flex;
            margin: 20px 0;
        }
        #passwordResult {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px 0 0 5px;
            font-size: 18px;
        }
        #copyBtn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        #copyBtn:hover {
            background: #3367d6;
        }
        .strength-meter {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .strength-label {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="ToolKit Logo">
                <h1>ToolKit</h1>
            </a>
        </div>
    </header>

    <main>
        <div class="generator-container">
            <h2>Password Generator</h2>
            <p>Create strong, secure passwords</p>
            
            <div class="result">
                <input type="text" id="passwordResult" readonly>
                <button id="copyBtn"><i class="fas fa-copy"></i></button>
            </div>
            
            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="strength-label" id="strengthLabel">Password Strength: Weak</div>
            
            <div class="options">
                <div class="option-group">
                    <label>
                        <input type="range" id="lengthSlider" min="4" max="32" value="12">
                        <span id="lengthValue">12 characters</span>
                    </label>
                </div>
                
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="uppercase" checked>
                        Include Uppercase Letters (A-Z)
                    </label>
                </div>
                
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="lowercase" checked>
                        Include Lowercase Letters (a-z)
                    </label>
                </div>
                
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="numbers" checked>
                        Include Numbers (0-9)
                    </label>
                </div>
                
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="symbols">
                        Include Symbols (!@#$%^&*)
                    </label>
                </div>
            </div>
            
            <button class="btn" id="generateBtn">Generate Password</button>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="author-info">
                <h3>About the Author</h3>
                <p>John Doe</p>
                <p>Web Developer & Tool Creator</p>
                <p>contact@example.com</p>
            </div>
            <div class="copyright">
                <p>&copy; <span id="year"></span> ToolKit. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        const passwordResult = document.getElementById('passwordResult');
        const copyBtn = document.getElementById('copyBtn');
        const generateBtn = document.getElementById('generateBtn');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const uppercase = document.getElementById('uppercase');
        const lowercase = document.getElementById('lowercase');
        const numbers = document.getElementById('numbers');
        const symbols = document.getElementById('symbols');
        const strengthBar = document.getElementById('strengthBar');
        const strengthLabel = document.getElementById('strengthLabel');
        
        // Character sets
        const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
        const numberChars = '0123456789';
        const symbolChars = '!@#$%^&*()_+~`|}{[]\:;?><,./-=';
        
        // Update length display
        lengthSlider.addEventListener('input', () => {
            lengthValue.textContent = `${lengthSlider.value} characters`;
        });
        
        // Copy password
        copyBtn.addEventListener('click', () => {
            if (passwordResult.value) {
                passwordResult.select();
                document.execCommand('copy');
                
                // Visual feedback
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }
        });
        
        // Generate password
        generateBtn.addEventListener('click', () => {
            let chars = '';
            let password = '';
            
            if (uppercase.checked) chars += upperChars;
            if (lowercase.checked) chars += lowerChars;
            if (numbers.checked) chars += numberChars;
            if (symbols.checked) chars += symbolChars;
            
            if (chars === '') {
                alert('Please select at least one character type');
                return;
            }
            
            for (let i = 0; i < lengthSlider.value; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            passwordResult.value = password;
            updateStrengthIndicator(password);
        });
        
        // Calculate password strength
        function updateStrengthIndicator(password) {
            let strength = 0;
            const length = password.length;
            
            // Length contributes up to 50% of strength
            strength += Math.min(length / 32 * 50, 50);
            
            // Character variety contributes the rest
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSymbol = /[^A-Za-z0-9]/.test(password);
            
            const varietyCount = [hasUpper, hasLower, hasNumber, hasSymbol].filter(Boolean).length;
            strength += varietyCount * 12.5; // Each variety adds 12.5%
            
            // Update UI
            strengthBar.style.width = `${strength}%`;
            
            if (strength < 40) {
                strengthBar.style.backgroundColor = '#e74c3c';
                strengthLabel.textContent = 'Password Strength: Weak';
            } else if (strength < 70) {
                strengthBar.style.backgroundColor = '#f39c12';
                strengthLabel.textContent = 'Password Strength: Moderate';
            } else if (strength < 90) {
                strengthBar.style.backgroundColor = '#3498db';
                strengthLabel.textContent = 'Password Strength: Strong';
            } else {
                strengthBar.style.backgroundColor = '#2ecc71';
                strengthLabel.textContent = 'Password Strength: Very Strong';
            }
        }
        
        // Generate a password on page load
        generateBtn.click();
    </script>
</body>
</html>
