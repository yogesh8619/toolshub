<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EMI Calculator with Pie Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      margin-top: 10px;
      display: block;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      background-color: #e9f7ef;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>EMI Calculator</h2>

  <label for="principal">Loan Amount (₹):</label>
  <input type="number" id="principal" placeholder="e.g. 500000">

  <label for="rate">Annual Interest Rate (%):</label>
  <input type="number" id="rate" step="0.01" placeholder="e.g. 7.5">

  <label for="tenure">Loan Tenure:</label>
  <input type="number" id="tenure" placeholder="e.g. 5">

  <select id="tenureType">
    <option value="years">Years</option>
    <option value="months">Months</option>
  </select>

  <button onclick="calculateEMI()">Calculate EMI</button>

  <div class="result" id="result"></div>

  <canvas id="emiChart" width="400" height="400"></canvas>

  <script>
    let chartInstance = null;

    function calculateEMI() {
      const principal = parseFloat(document.getElementById("principal").value);
      const annualRate = parseFloat(document.getElementById("rate").value);
      let tenure = parseFloat(document.getElementById("tenure").value);
      const tenureType = document.getElementById("tenureType").value;

      if (tenureType === "years") {
        tenure = tenure * 12;
      }

      const monthlyRate = annualRate / (12 * 100);

      const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, tenure)) /
                  (Math.pow(1 + monthlyRate, tenure) - 1);

      const totalPayment = emi * tenure;
      const totalInterest = totalPayment - principal;

      document.getElementById("result").innerHTML = `
        Monthly EMI: ₹${emi.toFixed(2)}<br>
        Total Payment: ₹${totalPayment.toFixed(2)}<br>
        Total Interest: ₹${totalInterest.toFixed(2)}
      `;

      renderChart(principal, totalInterest);
    }

    function renderChart(principal, interest) {
      const ctx = document.getElementById('emiChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Principal', 'Interest'],
          datasets: [{
            data: [principal, interest],
            backgroundColor: ['#007bff', '#ffc107'],
            borderColor: ['#fff', '#fff'],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
            },
            title: {
              display: true,
              text: 'Principal vs Interest'
            }
          }
        }
      });
    }
  </script>
</body>
</html>
